<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Abrir chamado - NexaCorp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>NexaCorp</h1>
        <nav><a href="{{ url_for('index') }}">Inicio</a></nav>
    </header>
    <main>
        <div class="card">
            <h2>Abrir chamado de suporte</h2>
            {% if protocolo %}
                <p class="sucesso">Chamado criado com sucesso.</p>
                <p>Protocolo: <strong>{{ protocolo }}</strong></p>
                <p><a href="{{ url_for('chamados_detalhe', protocolo=protocolo) }}">Acompanhar chamado &rarr;</a></p>
            {% endif %}
            <form method="post" action="{{ url_for('chamados_novo') }}">
                <label for="assunto">Assunto</label>
                <input type="text" id="assunto" name="assunto" required>
                <label for="descricao">Descricao do problema</label>
                <textarea id="descricao" name="descricao" rows="5" required></textarea>
                <button type="submit">Abrir chamado</button>
            </form>
        </div>
    </main>
</body>
</html>

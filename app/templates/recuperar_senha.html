<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Recuperar senha - NexaCorp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>NexaCorp</h1>
        <nav><a href="{{ url_for('index') }}">Inicio</a></nav>
    </header>
    <main>
        <div class="card">
            <h2>Recuperar senha</h2>
            {% if mensagem %}
                <p class="sucesso">{{ mensagem }}</p>
            {% else %}
            <form method="post" action="{{ url_for('recuperar_senha') }}">
                <label for="email">Email cadastrado</label>
                <input type="email" id="email" name="email" required>
                <button type="submit">Enviar instrucoes</button>
            </form>
            {% endif %}
            <p>
                Ja tem um link de redefinicao?
                <a href="{{ url_for('recuperar_confirmar') }}">Confirmar redefinicao</a>
            </p>
        </div>
    </main>
</body>
</html>
